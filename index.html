<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Link+ P2P</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <!-- 顶部标题栏 -->
    <div class="app-header">
        <div class="header-title" id="connectionStatus">未连接信令服务器</div>
    </div>

    <!-- 房间连接控制条 -->
    <div class="room-bar">
        <input type="text" id="roomIdInput" placeholder="输入房间号..." />
        <button id="joinRoomBtn">加入房间</button>
    </div>

    <!-- 中部消息与音视频展示区 -->
    <div class="chat-messages" id="chatMessages">
        <!-- 音视频通话悬浮窗容器 -->
        <div class="media-container" id="mediaContainer">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
            <button class="call-hangup-btn" id="hangupCallBtn">挂断</button>
        </div>
    </div>

    <!-- 底部输入栏区 -->
    <div class="chat-footer">
        <div class="input-bar">
            <input type="text" class="text-input" id="messageInput" placeholder="发送消息..." disabled />
            <button class="icon-btn" id="togglePlusBtn">➕</button>
            <button class="icon-btn" id="sendMsgBtn">📤</button>
        </div>

        <!-- 加号扩展面板 -->
        <div class="extension-panel" id="extensionPanel">
            <div class="grid-item" id="startVideoCallBtn">
                <div class="grid-icon">📹</div>
                <div class="grid-label">视频通话</div>
            </div>
            <div class="grid-item" id="startVoiceCallBtn">
                <div class="grid-icon">🎤</div>
                <div class="grid-label">语音通话</div>
            </div>
            <div class="grid-item" onclick="document.getElementById('fileInput').click()">
                <div class="grid-icon">📁</div>
                <div class="grid-label">发送文件</div>
            </div>
        </div>
    </div>
</div>

<input type="file" id="fileInput" style="display: none;" />

<script src="app.js"></script>
</body>
</html>
