<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Link +</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="wx-header">
    <span class="header-left-title">Link +</span>
    <span class="header-right-credit">三藏制作</span>
</header>

<main id="chat-box">
    <div class="msg peer">
        <div class="bubble">Link + 已就绪：点击下方加号开始测试交互。</div>
    </div>
</main>

<footer class="wx-footer">
    <input type="text" id="msg-input" class="text-input" placeholder="给 Link + 发消息或发送文件..." autocomplete="off">
    <button class="icon-btn" id="plus-btn">➕</button>
</footer>

<nav id="plus-panel">
    <div class="grid-item" id="btn-video"><div class="grid-icon">📹</div><span class="grid-label">打视频</span></div>
    <div class="grid-item" id="btn-voice"><div class="grid-icon">📞</div><span class="grid-label">打电话</span></div>
    <div class="grid-item" id="btn-file"><div class="grid-icon">📁</div><span class="grid-label">发文件</span></div>
    <div class="grid-item" id="btn-transfer"><div class="grid-icon">📤</div><span class="grid-label">文件传输</span></div>
    <div class="grid-item" id="btn-photo"><div class="grid-icon">🖼️</div><span class="grid-label">发照片</span></div>
</nav>

<!-- 隐藏的原生输入载体 -->
<input type="file" id="real-file-input" style="display: none;">
<input type="file" id="real-transfer-input" multiple style="display: none;">
<input type="file" id="real-photo-input" accept="image/*" style="display: none;">

<script src="app.js"></script>
</body>
</html>
