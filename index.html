<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Link+</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="wx-header">
    <span class="header-left-title">Link+</span>
    <span class="header-right-credit">三藏制作</span>
</header>

<main id="chat-box">
    <div class="msg peer">
        <div class="bubble">Link+ P2P引擎已就绪：点击下方加号开始连接或测试。</div>
    </div>
</main>

<footer class="wx-footer">
    <input type="text" id="msg-input" class="text-input" placeholder="给 Link+ 发消息或文件..." autocomplete="off">
    <button class="icon-btn" id="plus-btn">➕</button>
</footer>

<nav id="plus-panel">
    <div class="grid-item" id="btn-connect"><div class="grid-icon">🔗</div><span class="grid-label">建立直连</span></div>
    <div class="grid-item" id="btn-video"><div class="grid-icon">📹</div><span class="grid-label">视频通话</span></div>
    <div class="grid-item" id="btn-voice"><div class="grid-icon">📞</div><span class="grid-label">语音通话</span></div>
    <div class="grid-item" id="btn-file"><div class="grid-icon">📁</div><span class="grid-label">文件</span></div>
    <div class="grid-item" id="btn-photo"><div class="grid-icon">🖼️</div><span class="grid-label">照片</span></div>
</nav>

<!-- 隐藏的原生输入载体 -->
<input type="file" id="real-file-input" style="display: none;">
<input type="file" id="real-photo-input" accept="image/*" style="display: none;">

<script src="app.js"></script>
</body>
</html>
