<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三藏制作 - 终极 P2P 赛博微信（自由体验版）</title>
    <style>
        :root {
            --primary: #007aff;
            --primary-hover: #005bb5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --my-msg: #0284c7;
            --peer-msg: #334155;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 10px;
            background: var(--bg);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        /* 顶栏 */
        .header {
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
            margin-bottom: 10px;
        }
        .title-area h2 { margin: 0; font-size: 1.1rem; color: var(--primary); }
        .badge { font-size: 0.7rem; background: rgba(0,122,255,0.15); color: var(--primary); padding: 2px 8px; border-radius: 6px; font-weight: bold; }

        /* 控制面板卡片 */
        .card {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
        .status-indicator { display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); }
        .dot.connected { background: var(--success); }
        .dot.disconnected { background: var(--danger); }

        .btn-group { display: flex; gap: 8px; margin-bottom: 6px; }
        .btn-group:last-child { margin-bottom: 0; }
        
        button {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.85rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }
        button:hover { background: var(--primary-hover); }
        button.secondary { background: #475569; }
        button.danger { background: var(--danger); }
        button.success { background: var(--success); }

        /* 聊天主界面 */
        .chat-container {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        #typing-status {
            font-size: 0.75rem;
            color: var(--text-muted);
            padding: 4px 12px;
            height: 16px;
            font-style: italic;
        }

        #chat-box {
            flex: 1;
            overflow-y: scroll;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 消息气泡设计 */
        .msg-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }
        .msg-wrapper.me { align-self: flex-end; align-items: flex-end; }
        .msg-wrapper.peer { align-self: flex-start; align-items: flex-start; }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-all;
        }
        .msg-wrapper.me .msg-bubble { background: var(--my-msg); color: white; border-bottom-right-radius: 2px; }
        .msg-wrapper.peer .msg-bubble { background: var(--peer-msg); color: var(--text-main); border-bottom-left-radius: 2px; }

        .msg-bubble img { max-width: 100%; border-radius: 8px; display: block; margin-top: 4px; cursor: pointer; }
        .file-card { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 8px; margin-top: 4px; }
        .file-info { font-size: 0.85rem; }
        .file-info a { color: #fff; text-decoration: underline; font-size: 0.75rem; }

        .msg-meta {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 3px;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .read-receipt { font-weight: bold; color: var(--success); }

        /* 输入区 */
        .input-area {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            gap: 8px;
            align-items: center;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }
        input[type="text"]:focus { border-color: var(--primary); }
        .icon-btn {
            background: #475569;
            flex: 0 0 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0;
        }
        .icon-btn:hover { background: var(--primary); }

        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 400px;
        }
        .modal-content textarea {
            width: 100%; height: 90px; margin: 10px 0; padding: 8px;
            background: #0f172a; color: white; border: 1px solid var(--border);
            border-radius: 6px; resize: none; font-size: 0.75rem;
        }

        /* 视频通话浮窗 */
        #call-modal .modal-content {
            max-width: 480px;
            text-align: center;
        }
        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 15px 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            min-height: 180px;
        }
        .video-grid video { width: 100%; height: 100%; object-fit: cover; background: #111; }

        .footer { text-align: center; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title-area">
            <h2>🚀 三藏制作</h2>
        </div>
        <span class="badge">自由体验版</span>
    </div>

    <!-- 控制卡片 -->
    <div class="card">
        <div class="status-row">
            <div class="status-indicator">
                <span id="dot" class="dot"></span>
                <span id="status-text">通道未连接 (离线测试可用)</span>
            </div>
            <button onclick="clearHistory()" style="flex:0 0 auto; padding:4px 8px; font-size:0.75rem; background:#475569;">清空记录</button>
        </div>
        <div class="btn-group">
            <button onclick="startHost()">1. 创建连接 (A端)</button>
            <button class="secondary" onclick="startJoin()">2. 加入连接 (B端)</button>
        </div>
        <div class="btn-group" style="margin-top: 8px;">
            <button class="success" onclick="startCall('audio')">📞 语音通话</button>
            <button class="success" onclick="startCall('video')">📹 视频通话</button>
        </div>
    </div>

    <!-- 聊天主视窗 -->
    <div class="chat-container">
        <div id="typing-status"></div>
        <div id="chat-box"></div>
        <div class="input-area">
            <input type="file" id="file-picker" style="display:none" onchange="handleFileSelected(this)">
            <button class="icon-btn" title="发图片/文件" onclick="document.getElementById('file-picker').click()">📁</button>
            <input type="text" id="msg-input" placeholder="输入消息 (不连网也可直接本地发送测试)..." oninput="notifyTyping()" onkeydown="if(event.key==='Enter') sendMsg()">
            <button onclick="sendMsg()" style="flex: 0 0 55px; height: 38px;">发送</button>
        </div>
    </div>

    <div class="footer">纯端到端 P2P 直连 · 自由离线测试版 · 三藏制作出品</div>
</div>

<!-- 暗号模态框 -->
<div id="modal" class="modal">
    <div class="modal-content">
        <h3 id="modal-title" style="margin-top:0; font-size:1rem; color:var(--primary);">安全暗号交换</h3>
        <p id="modal-tip" style="font-size:0.8rem; color:var(--text-muted);">请按照提示复制或填入暗号：</p>
        <textarea id="modal-text"></textarea>
        <div class="btn-group">
            <button class="secondary" onclick="closeModal()">取消</button>
            <button onclick="handleModalSubmit()">确定</button>
        </div>
    </div>
</div>

<!-- 音视频通话面板 -->
<div id="call-modal" class="modal">
    <div class="modal-content">
        <h3 id="call-title" style="margin-top:0; color:var(--primary);">实时通话测试</h3>
        <div class="video-grid">
            <video id="local-video" autoplay muted playsinline></video>
            <video id="remote-video" autoplay playsinline></video>
        </div>
        <div id="call-status" style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px;">本地摄像头预览测试中...</div>
        <button class="danger" onclick="endCall()">关闭预览/挂断</button>
    </div>
</div>

<script>
    const standardRtcConfig = {
        iceServers: [
            { urls: 'stun:stun.qq.com:3478' },
            { urls: 'stun:stun.miwifi.com:3478' },
            { urls: 'stun:stun.l.google.com:19302' }
        ]
    };

    let pc, dataChannel;
    let localStream, remoteStream;
    let typingTimer = null;
    const STORAGE_KEY = 'sanzang_cyber_chat_free';

    let incomingFile = { name: '', size: 0, type: '', buffer: [], receivedSize: 0 };

    const chatBox = document.getElementById('chat-box');
    const statusText = document.getElementById('status-text');
    const dot = document.getElementById('dot');
    const typingStatus = document.getElementById('typing-status');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalTip = document.getElementById('modal-tip');
    const modalText = document.getElementById('modal-text');
    let modalCallback = null;

    window.onload = function() {
        loadHistory();
    };

    function initPC() {
        if (pc) pc.close();
        pc = new RTCPeerConnection(standardRtcConfig);

        pc.ondatachannel = (event) => {
            dataChannel = event.channel;
            setupDataChannel();
        };

        remoteStream = new MediaStream();
        document.getElementById('remote-video').srcObject = remoteStream;
        pc.ontrack = (event) => {
            event.streams[0].getTracks().forEach(track => {
                remoteStream.addTrack(track);
            });
            document.getElementById('call-status').innerText = '通话中';
        };

        pc.onconnectionstatechange = () => {
            if (pc.connectionState === 'connected') {
                updateStatus('connected', 'P2P 加密直连已建立');
                sendSignal({ type: 'READ_ALL' });
            } else if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
                updateStatus('disconnected', '连接已断开');
            }
        };
    }

    function setupDataChannel() {
        dataChannel.onopen = () => updateStatus('connected', '数据通道已就绪');
        dataChannel.onclose = () => updateStatus('disconnected', '通道已关闭');
        dataChannel.binaryType = 'arraybuffer';

        dataChannel.onmessage = (event) => {
            if (typeof event.data === 'string') {
                try {
                    const packet = JSON.parse(event.data);
                    if (packet.type === 'TYPING') {
                        typingStatus.innerText = '对方正在输入...';
                        clearTimeout(typingTimer);
                        typingTimer = setTimeout(() => { typingStatus.innerText = ''; }, 2000);
                        return;
                    }
                    if (packet.type === 'READ_ALL') {
                        markAllAsReadLocally();
                        return;
                    }
                    if (packet.type === 'MSG') {
                        appendMsg('peer', packet.text, packet.time, '已送达', packet.id);
                        sendSignal({ type: 'READ_ALL' });
                        return;
                    }
                    if (packet.type === 'FILE_META') {
                        incomingFile.name = packet.name;
                        incomingFile.size = packet.size;
                        incomingFile.fileType = packet.fileType;
                        incomingFile.buffer = [];
                        incomingFile.receivedSize = 0;
                        return;
                    }
                    if (packet.type === 'CALL_REQUEST') {
                        showCallModal(packet.callType, true);
                        return;
                    }
                    if (packet.type === 'CALL_END') {
                        closeCallModal();
                        return;
                    }
                } catch (e) {
                    console.error("解析数据失败", e);
                }
            } else {
                incomingFile.buffer.push(event.data);
                incomingFile.receivedSize += event.data.byteLength;

                if (incomingFile.receivedSize >= incomingFile.size) {
                    const blob = new Blob(incomingFile.buffer, { type: incomingFile.fileType });
                    const fileUrl = URL.createObjectURL(blob);
                    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                    if (incomingFile.fileType.startsWith('image/')) {
                        appendMsg('peer', `<img src="${fileUrl}" onclick="window.open('${fileUrl}')">`, time, '已送达', 'img_' + Date.now());
                    } else {
                        const fileHtml = `<div class="file-card">📄 <div class="file-info"><b>${incomingFile.name}</b><br><a href="${fileUrl}" download="${incomingFile.name}">点击下载文件</a></div></div>`;
                        appendMsg('peer', fileHtml, time, '已送达', 'file_' + Date.now());
                    }
                    sendSignal({ type: 'READ_ALL' });
                }
            }
        };
    }

    function sendSignal(obj) {
        if (dataChannel && dataChannel.readyState === 'open') {
            dataChannel.send(JSON.stringify(obj));
        }
    }

    function notifyTyping() {
        sendSignal({ type: 'TYPING' });
    }

    async function startHost() {
        initPC();
        dataChannel = pc.createDataChannel("chat");
        setupDataChannel();

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        waitForIceComplete(() => {
            showModal("A端暗号 (复制发给B端)", "请将下方暗号复制并发送给对方：", JSON.stringify(pc.localDescription), (ansStr) => {
                try {
                    pc.setRemoteDescription(JSON.parse(ansStr));
                } catch(e) { alert("暗号解析错误"); }
            });
        });
    }

    async function startJoin() {
        initPC();
        showModal("输入A端暗号", "请将A端发给你的暗号粘贴到下方：", "", async (offerStr) => {
            try {
                await pc.setRemoteDescription(JSON.parse(offerStr));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);

                waitForIceComplete(() => {
                    showModal("B端应答暗号 (复制发回给A端)", "请将生成的应答暗号复制，发回给A端完成握手：", JSON.stringify(pc.localDescription), (dummy) => {});
                });
            } catch(e) { alert("连接失败，请核对暗号"); }
        });
    }

    function waitForIceComplete(cb) {
        if (!pc || pc.iceGatheringState === 'complete') cb();
        else {
            function check() {
                if (!pc || pc.iceGatheringState === 'complete') {
                    if (pc) pc.removeEventListener('icegatheringstatechange', check);
                    cb();
                }
            }
            pc.addEventListener('icegatheringstatechange', check);
        }
    }

    function updateStatus(state, text) {
        statusText.innerText = text;
        dot.className = 'dot ' + state;
    }

    // 自由发送消息（不限制必须连上，未连接也能本地测试发送、存库）
    function sendMsg() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text) return;

        // 如果连通了就走通道发过去，没连通也允许本地模拟发送
        if (dataChannel && dataChannel.readyState === 'open') {
            const msgId = 'msg_' + Date.now() + Math.random().toString(36).substr(2, 5);
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            sendSignal({ type: 'MSG', text, time, id: msgId });
            appendMsg('me', text, time, '送达·未读', msgId);
            saveMessageStorage('me', text, time, '送达·未读', msgId);
        } else {
            // 离线/未连接时的本地模拟测试
            const msgId = 'msg_' + Date.now() + Math.random().toString(36).substr(2, 5);
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            appendMsg('me', text + " (未连接本地预览)", time, '本地草稿', msgId);
            saveMessageStorage('me', text + " (未连接本地预览)", time, '本地草稿', msgId);
        }

        input.value = '';
    }

    // 自由文件/图片选择（不限制连上，未连接也可本地预览）
    function handleFileSelected(input) {
        const file = input.files[0];
        if (!file) return;

        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const fileUrl = URL.createObjectURL(file);

        if (dataChannel && dataChannel.readyState === 'open') {
            sendSignal({ type: 'FILE_META', name: file.name, size: file.size, fileType: file.type });
            if (file.type.startsWith('image/')) {
                appendMsg('me', `<img src="${fileUrl}" onclick="window.open('${fileUrl}')">`, time, '送达·未读', 'img_' + Date.now());
            } else {
                const fileHtml = `<div class="file-card">📄 <div class="file-info"><b>${file.name}</b><br><a href="${fileUrl}" download="${file.name}">点击下载文件</a></div></div>`;
                appendMsg('me', fileHtml, time, '送达·未读', 'file_' + Date.now());
            }

            // 分块发送
            const CHUNK_SIZE = 16384;
            const reader = new FileReader();
            let offset = 0;
            reader.onload = function(e) {
                dataChannel.send(e.target.result);
                offset += e.target.result.byteLength;
                if (offset < file.size) readNextChunk();
            };
            function readNextChunk() {
                reader.readAsArrayBuffer(file.slice(offset, offset + CHUNK_SIZE));
            }
            readNextChunk();
        } else {
            // 未连接时的本地预览测试
            if (file.type.startsWith('image/')) {
                appendMsg('me', `<img src="${fileUrl}" onclick="window.open('${fileUrl}')">`, time, '本地预览', 'img_' + Date.now());
            } else {
                const fileHtml = `<div class="file-card">📄 <div class="file-info"><b>${file.name} (本地预览)</b><br><a href="${fileUrl}" download="${file.name}">点击下载文件</a></div></div>`;
                appendMsg('me', fileHtml, time, '本地预览', 'file_' + Date.now());
            }
        }
        input.value = '';
    }

    // 自由音视频通话（未连接时点开可直接测试本地摄像头/麦克风预览）
    async function startCall(callType) {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: callType === 'video'
            });
            document.getElementById('local-video').srcObject = localStream;
            
            // 如果连上了就通知对方
            if (pc && pc.connectionState === 'connected') {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
                sendSignal({ type: 'CALL_REQUEST', callType });
            }
            showCallModal(callType, false);
        } catch (e) {
            alert("无法获取摄像头或麦克风权限，请检查浏览器设置！");
        }
    }

    async function showCallModal(callType, isIncoming) {
        document.getElementById('call-title').innerText = callType === 'video' ? '📹 视频通话 (预览中)' : '📞 语音通话 (预览中)';
        document.getElementById('call-modal').style.display = 'flex';

        if (isIncoming) {
            document.getElementById('call-status').innerText = '收到远程通话请求...';
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: callType === 'video'
                });
                document.getElementById('local-video').srcObject = localStream;
                if (pc) localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            } catch(e) {}
        } else {
            if (!pc || pc.connectionState !== 'connected') {
                document.getElementById('call-status').innerText = '当前未联网，正在进行本地摄像头/麦克风独立预览测试';
            }
        }
    }

    function endCall() {
        if (pc && pc.connectionState === 'connected') {
            sendSignal({ type: 'CALL_END' });
        }
        closeCallModal();
    }

    function closeCallModal() {
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
        }
        document.getElementById('call-modal').style.display = 'none';
        document.getElementById('call-status').innerText = '等待接听...';
    }

    function appendMsg(sender, content, time, status, id) {
        const wrapper = document.createElement('div');
        wrapper.className = `msg-wrapper ${sender}`;
        wrapper.setAttribute('data-id', id || '');

        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble';
        if (content.startsWith('<img') || content.startsWith('<div')) {
            bubble.innerHTML = content;
        } else {
            bubble.innerText = content;
        }
        wrapper.appendChild(bubble);

        const meta = document.createElement('div');
        meta.className = 'msg-meta';
        
        const timeSpan = document.createElement('span');
        timeSpan.innerText = time;
        meta.appendChild(timeSpan);

        if (sender === 'me') {
            const receiptSpan = document.createElement('span');
            receiptSpan.className = 'read-receipt status-tag';
            receiptSpan.innerText = status;
            meta.appendChild(receiptSpan);
        }

        wrapper.appendChild(meta);
        chatBox.appendChild(wrapper);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function saveMessageStorage(sender, text, time, status, id) {
        let history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        history.push({ sender, text, time, status, id });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    function loadHistory() {
        chatBox.innerHTML = '';
        let history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        history.forEach(m => {
            appendMsg(m.sender, m.text, m.time, m.status || '已读', m.id);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function markAllAsReadLocally() {
        const tags = document.querySelectorAll('.status-tag');
        tags.forEach(tag => {
            if(tag.innerText.includes('未读')) {
                tag.innerText = '已读 ✓✓';
                tag.style.color = '#34c759';
            }
        });
        let history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        history = history.map(m => {
            if (m.sender === 'me' && m.status.includes('未读')) m.status = '已读 ✓✓';
            return m;
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    function clearHistory() {
        if (confirm("确定要清空本地所有聊天记录吗？")) {
            localStorage.removeItem(STORAGE_KEY);
            chatBox.innerHTML = '';
        }
    }

    function showModal(title, tip, content, cb) {
        modalTitle.innerText = title;
        modalTip.innerText = tip;
        modalText.value = content;
        if (content) modalText.select();
        modal.style.display = 'flex';
        modalCallback = cb;
    }
    function closeModal() { modal.style.display = 'none'; }
    function handleModalSubmit() {
        const val = modalText.value;
        closeModal();
        if (modalCallback) modalCallback(val);
    }
</script>

</body>
</html>
